services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  Passionweb\LoggingApi\:
    resource: "../Classes/*"

  Passionweb\LoggingApi\Command\LogBasicsCommand:
    tags:
      -   name: 'console.command'
          command: 'codebreak:log:basics'
          description: 'Log one message per PSR-3 log level and show what reaches the log file'
          schedulable: false

  Passionweb\LoggingApi\Command\LogComponentsCommand:
    tags:
      -   name: 'console.command'
          command: 'codebreak:log:components'
          description: 'Show how logger names are built and how a logger is requested'
          schedulable: false

  Passionweb\LoggingApi\Command\LogConfigurationCommand:
    tags:
      -   name: 'console.command'
          command: 'codebreak:log:configuration'
          description: 'Show which writers a logger gets from the LOG configuration'
          schedulable: false

  Passionweb\LoggingApi\Command\LogChannelsCommand:
    tags:
      -   name: 'console.command'
          command: 'codebreak:log:channels'
          description: 'Group loggers of different classes into one channel'
          schedulable: false

  Passionweb\LoggingApi\Command\LogWritersCommand:
    tags:
      -   name: 'console.command'
          command: 'codebreak:log:writers'
          description: 'Write one record with the database, rotating file and PHP error log writer'
          schedulable: false

  Passionweb\LoggingApi\Command\LogContextCommand:
    tags:
      -   name: 'console.command'
          command: 'codebreak:log:context'
          description: 'Log placeholders, context data and exceptions'
          schedulable: false

  Passionweb\LoggingApi\Command\LogProcessorsCommand:
    tags:
      -   name: 'console.command'
          command: 'codebreak:log:processors'
          description: 'Enrich log records with memory usage, request data and a backtrace'
          schedulable: false
